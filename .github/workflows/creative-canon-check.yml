name: Creative canon regression check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check topic index routes
        run: python3 scripts/canon_lookup.py check
      - name: Smoke-test bounded lookup
        run: |
          python3 scripts/canon_lookup.py route "矿车" > /dev/null
          python3 scripts/canon_lookup.py headings "设定/世界设定/03_地下矿道与采矿流程.md" > /dev/null
          python3 scripts/canon_lookup.py read "设定/世界设定/03_地下矿道与采矿流程.md" "采矿机与下矿流程" > /dev/null
          python3 scripts/canon_lookup.py search "能量匣" > /dev/null
      - name: Scan canon and episode scripts
        run: python3 scripts/check_canon.py
