name: One-off migrate content from YiXingBianJing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-from-yixing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/terry-xu-2077/YiXingBianJing.git /tmp/YiXingBianJing

      - name: Copy complete 设定 folder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p '设定'
          cp -a /tmp/YiXingBianJing/'设定'/.'设定'/

          echo 'Migrated files:'
          find '设定' -type f -print | sort

      - name: Commit migrated content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '设定'
          if git diff --cached --quiet; then
            echo 'No content changes to commit.'
          else
            git commit -m 'Migrate complete setting folder from YiXingBianJing'
            git push origin HEAD:main
          fi
