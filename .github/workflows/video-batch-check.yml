name: Video batch document checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test video batch validator
        run: python3 -m unittest discover -s tests -v
      - name: Validate video prompt documents
        run: python3 scripts/check_video_batches.py
